# Free plan: pose runs in the browser (MediaPipe GPU). Render only hosts the page.
# A Free instance cannot run PyTorch, and server-side YOLO is what made the frame rate low.
services:
  - type: web
    name: posture-web
    runtime: python
    repo: https://github.com/jialingshi13/ultralytics
    branch: feat/posture-web-render
    plan: free
    rootDir: posture-web
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60 server:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: POSTURE_INFER
        value: client
      - key: POSTURE_PRELOAD
        value: "0"
